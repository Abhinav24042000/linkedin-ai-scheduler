services:
  linkedin-scheduler:
    build: .
    container_name: linkedin-scheduler
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/app/server/data/linkedin-scheduler.db
    volumes:
      - ./server/data:/app/server/data
